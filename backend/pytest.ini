[pytest]
testpaths = tests
# E2E(실제 브라우저)는 느리고 Edge 가 필요하므로 기본 실행에서 뺀다: 돌리려면 `pytest tests/e2e -m e2e`
addopts = -q --strict-markers -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning
markers =
    perf: 대용량/성능 테스트 (기본 실행에서 제외하려면 -m "not perf")
    e2e: 실제 브라우저로 화면을 조작하는 시나리오 테스트 (Edge 필요, 기본 실행에서 제외)
